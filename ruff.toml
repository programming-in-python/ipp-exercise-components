# ruff.toml  - PEP 8 / teaching mode (Intro-to-Programming course)
#
# Standalone Python teaching follows canonical PEP 8 so students learn
# idiomatic Python. pep8-naming (N) is enabled explicitly, since it is not
# in ruff's default select set, and pydocstyle (D) enforces PEP 257 with
# Google-style sections.
#
# Docstrings use the always-multi-line form: the opening and closing triple
# quotes each sit on their own line and the summary begins on the line after
# the opening quotes, even for a single-sentence docstring. D200 (one-line
# docstring should fit on one line) and D212 (summary on the first line) are
# ignored so that form validates; D213 (summary on the second line) then holds.

# `select` (not `extend-select`) pins the exact rule set rather than adding
# to ruff's built-in default, which has broadened across releases and would
# otherwise pull in rules the course never opted into (LOG, DTZ, BLE, PLR).
# E4/E7/E9 + F are ruff's historical default; N adds pep8-naming and D adds
# pydocstyle / PEP 257. See README-LINTER.md for the full rationale.
[lint]
select = ["E4", "E7", "E9", "F", "N", "D"]
ignore = ["D200", "D212"]   # always-multi-line docstrings; summary on line two

[lint.pydocstyle]
convention = "google"       # parse Args:/Returns:/Raises:; keeps D417 useful

[lint.per-file-ignores]
# tests document scenarios in method names rather than docstrings
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]
# empty package markers do not need a package docstring
"**/__init__.py" = ["D104"]

[format]
indent-style = "space"
