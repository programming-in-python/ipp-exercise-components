#
# MQTT client configuration information
#
[mqtt.gateway_service]
cred_file       = ./cred/PiotMqttCred.cfg
host           = localhost
port           = 1883
secure_port     = 1884
default_qos     = 0
keep_alive      = 30
enable_crypt    = False

#
# IPP test app specific configuration information
#
[ipp_test_app]
device_id = edgedevice001
device_location_id = edgedevice001
enable_emulator  = False
enable_sense_hat  = False
enable_logging   = True
poll_cycle_secs   = 60
test_gda_data_path = /tmp/gda-data
test_cda_data_path = /tmp/cda-data
cred_file        = ./tests/unit/common/DummyCredFile.cfg
humidity_sim_floor   = 35
humidity_sim_ceiling = 45
